name: 우리아이 앱청소 빌드

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KBI_KEYSTORE_BASE64 != '' }}

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: SDK 36 설치
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 테스트용 APK 만들기 (폰에 바로 설치용)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 테스트용 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 1-테스트용-APK
          path: app/build/outputs/apk/debug/*.apk

      # ─── 아래는 서명 키(Secrets)를 넣었을 때만 실행 ───
      - name: 서명 키 풀기
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KBI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KBI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: 플레이스토어용 AAB + 정식 APK 만들기
        if: env.HAS_KEY == 'true'
        env:
          KBI_KEYSTORE_PASSWORD: ${{ secrets.KBI_KEYSTORE_PASSWORD }}
          KBI_KEY_ALIAS: ${{ secrets.KBI_KEY_ALIAS }}
          KBI_KEY_PASSWORD: ${{ secrets.KBI_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: 플레이스토어용 AAB 올리기
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 2-플레이스토어-업로드용-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: 정식 APK 올리기
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 3-정식-APK
          path: app/build/outputs/apk/release/*.apk
